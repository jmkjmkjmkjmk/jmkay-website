<style>
@font-face{font-family:'Kay Display';src:url('/KayDisplay-Regular.otf') format('opentype');font-display:swap}
:root{--pap:#faf7f2;--card:#fff;--ink:#23201c;--mut:#6d675f;--line:#e0d9cf;--terra:#a8553a;--sage:#5d7355;--hot:#8f3a22;--mark:#f6e6c8;--markline:#d4a95f;--soft:#f3eee6;--fs:19px}

[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--pap);color:var(--ink);font:17px/1.55 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
button{font:inherit;color:inherit}
.kick{font:600 11px/1.3 ui-sans-serif,system-ui,-apple-system,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lk{width:100%;max-width:360px}
.lk h1,header.top h1,section.piece>header h2,#send h2{font-family:'Kay Display',Georgia,serif;font-weight:400;text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
.lk h1{font-size:36px;margin:.3em 0 .6em}
#pw{width:100%;font:17px ui-sans-serif,system-ui,-apple-system,sans-serif;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
#lf label{display:flex;gap:8px;align-items:center;margin:12px 0 16px;font:14px ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--mut)}
.btn{font:600 13px/1 ui-sans-serif,system-ui,-apple-system,sans-serif;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--terra);border-radius:999px;padding:12px 20px;cursor:pointer;background:var(--terra);color:var(--pap)}
.btn.ghost{background:transparent;color:var(--terra);border-color:var(--line)}
#lerr{color:var(--hot);font:14px ui-sans-serif,system-ui,-apple-system,sans-serif;min-height:1.4em}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 120px}
header.top h1{font-size:36px;margin:.3em 0 .3em}
.state{font:13.5px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--mut);margin:0 0 10px}
.countdown{font:600 12px ui-sans-serif,system-ui,-apple-system,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--hot);margin:0 0 14px}
.how{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--sage);border-radius:10px;padding:12px 14px;font-size:15.5px;margin:0 0 16px}
.how p{margin:0 0 7px}.how p:last-child{margin:0}
nav.toc{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.tocb{font:600 12.5px ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;display:inline-flex;gap:7px;align-items:center;cursor:pointer}
.tocb i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.tocb.ok i{background:var(--sage)}
.tocb small{font-weight:500;color:var(--mut)}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 6px;font:12px ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--mut)}
details summary{cursor:pointer;font:600 12px ui-sans-serif,system-ui,-apple-system,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);list-style:none;padding:4px 0}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+ "}
details[open]>summary::before{content:"\2013  "}
details.days{margin:12px 0 0;border-top:1px solid var(--line);padding-top:8px}
.day{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:10px 0}
.day b{font:600 14px ui-sans-serif,system-ui,-apple-system,sans-serif}
.day span{font:600 10px ui-sans-serif,system-ui,-apple-system,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--terra);margin-left:8px}
.day p{margin:3px 0 0;font-size:15px}
section.piece{margin:48px 0 0;padding-top:18px;border-top:2px solid var(--ink);scroll-margin-top:8px}
section.piece>header h2{font-size:30px;margin:0 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font:600 11.5px ui-sans-serif,system-ui,-apple-system,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.meta .hot{color:var(--hot)}
.wcline{font:13.5px/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--mut);margin:7px 0 0}
.wcline .warn{color:var(--hot);font-weight:600}
.lede{font-size:15.5px;margin:12px 0 0}
h3.sub{font:600 12px ui-sans-serif,system-ui,-apple-system,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:32px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin:0 0 14px;scroll-margin-top:12px}
.card.done{border-color:var(--sage);box-shadow:inset 3px 0 0 var(--sage)}
.card .bd{font:600 10.5px ui-sans-serif,system-ui,-apple-system,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.card h4{margin:2px 0 0;font-size:18px;line-height:1.3;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 2px}
.tag{font:600 10.5px ui-sans-serif,system-ui,-apple-system,sans-serif;letter-spacing:.03em;border-radius:999px;padding:3px 8px;border:1px solid var(--line);color:var(--mut)}
.t-sage{color:var(--sage);border-color:var(--sage)}.t-terra{color:var(--terra);border-color:var(--terra)}.t-ink{color:var(--ink)}
.f{margin:11px 0 0;font-size:15.5px}
.fl{font:600 10.5px ui-sans-serif,system-ui,-apple-system,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.f.box>div:last-child{background:var(--soft);border-radius:8px;padding:8px 10px}
.card details{margin:10px 0 0}
.delta{font:12.5px ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--mut);margin-top:8px}
.where{font:600 12.5px ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--terra);background:none;border:0;padding:0;margin-top:9px;cursor:pointer}
.dec,.vd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 9px}
.db{border:1px solid var(--line);background:var(--pap);border-radius:10px;padding:9px 9px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:60px}
.db b{font:600 14px ui-sans-serif,system-ui,-apple-system,sans-serif}
.db small{font:12px/1.3 ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--mut)}
.db em{font:600 9.5px ui-sans-serif,system-ui,-apple-system,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--sage);font-style:normal}
.db.on{color:var(--pap)}
.db.on small,.db.on em{color:var(--pap);opacity:.9}
.db.on.d-yes,.db.on.d-send{background:var(--sage);border-color:var(--sage)}
.db.on.d-alt,.db.on.d-changes{background:var(--terra);border-color:var(--terra)}
.db.on.d-note,.db.on.d-hold{background:var(--ink);border-color:var(--ink)}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:15px/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--pap);color:var(--ink);resize:vertical}
.text{font-size:var(--fs);line-height:1.62}
.para{position:relative;margin:0 0 .9em;cursor:pointer;border-radius:4px}

@media (min-width:900px){.para .pn{display:block;position:absolute;left:-44px;top:.3em;width:32px;text-align:right;font:11px ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--mut);opacity:.7;user-select:none;-webkit-user-select:none}}
.para.has::before{content:"";position:absolute;left:-11px;top:3px;bottom:3px;width:3px;border-radius:2px;background:var(--terra)}
hr.brk{border:0;margin:1.5em 0;text-align:center;height:1em}
hr.brk::after{content:"\00B7  \00B7  \00B7";color:var(--mut);letter-spacing:.3em}
mark{background:var(--mark);color:inherit;border-bottom:2px solid var(--markline);border-radius:2px;padding:0 1px;cursor:pointer}
.flash{animation:fl 1.8s ease-out}
@keyframes fl{0%{box-shadow:0 0 0 5px var(--markline)}100%{box-shadow:0 0 0 0 transparent}}
.pnote{margin:-.35em 0 1.15em;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--terra);border-radius:8px;font:15px/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif}
.pnote .q{color:var(--mut);font-style:italic;margin-bottom:6px}
.pnote .row{display:flex;gap:8px;margin-top:8px}
.pnote .saved{white-space:pre-wrap;cursor:pointer}
.mini{font:600 11.5px ui-sans-serif,system-ui,-apple-system,sans-serif;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--pap);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer}
.mini.pri{background:var(--terra);color:var(--pap);border-color:var(--terra)}

.lst.ed{color:var(--terra)}
.lrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.lnotes{margin-top:12px;font-size:14.5px}
.lnotes li{margin:0 0 6px}
code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);padding:1px 4px;border-radius:4px}
.gate{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
.gate.ok{border-color:var(--sage);box-shadow:inset 3px 0 0 var(--sage)}
.gate label{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;margin:0 0 9px;cursor:pointer}
.gate input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--sage);flex:none}
#send{margin:56px 0 0;padding-top:18px;border-top:2px solid var(--ink)}
#send h2{font-size:30px;margin:0 0 8px}
.sendrow{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 8px}
#sendmsg{font:14px ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--sage);min-height:1.4em;margin:4px 0}
#preview{white-space:pre-wrap;word-break:break-word;font:12px/1.45 ui-monospace,Menlo,monospace;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:340px;overflow:auto}
.foot{margin-top:36px;font:13px/1.55 ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--mut)}
.foot p{margin:0 0 10px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:5}
#bar .pg{font:13px/1.3 ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--mut)}
#bar .btn{padding:11px 16px;white-space:nowrap}

<script>
(function(){
"use strict";
var KEYK="sp:"+SP.slug+":k", STK="sp:"+SP.slug+":state", FSK="sp:"+SP.slug+":fs";
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function b64e(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function $(q,r){return (r||document).querySelector(q)}
function $$(q,r){return Array.prototype.slice.call((r||document).querySelectorAll(q))}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

async function derive(pass){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);
  var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64d(SP.salt),iterations:SP.iter,hash:"SHA-256"},base,512);
  return new Uint8Array(bits);
}
async function unseal(raw){
  var iv=b64d(SP.blob.iv), ct=b64d(SP.blob.ct), mac=b64d(SP.blob.mac);
  var msg=new Uint8Array(iv.length+ct.length); msg.set(iv,0); msg.set(ct,iv.length);
  var mk=await crypto.subtle.importKey("raw",raw.slice(32,64),{name:"HMAC",hash:"SHA-256"},false,["verify"]);
  if(!(await crypto.subtle.verify("HMAC",mk,mac,msg))) throw new Error("mac");
  var ek=await crypto.subtle.importKey("raw",raw.slice(0,32),{name:"AES-CTR"},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-CTR",counter:iv,length:64},ek,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
var lock=$("#lock"), app=$("#app");
async function tryStored(){
  var s=lsGet(KEYK); if(!s) return false;
  try{ start(await unseal(b64d(s))); return true; }catch(e){ lsDel(KEYK); return false; }
}
$("#lf").addEventListener("submit",async function(ev){
  ev.preventDefault();
  var err=$("#lerr"), pw=$("#pw").value.trim().toLowerCase().replace(/[\s_]+/g,"-");
  if(!pw) return;
  if(!(window.crypto&&crypto.subtle)){ err.textContent="This browser can't open the page here; it needs the https address."; return; }
  err.textContent="Opening…";
  try{ var raw=await derive(pw); var P=await unseal(raw); if($("#rem").checked) lsSet(KEYK,b64e(raw)); err.textContent=""; start(P); }
  catch(e){ err.textContent="That isn’t it. Try again."; }
});
tryStored().then(function(ok){ if(!ok){ lock.hidden=false; try{$("#pw").focus()}catch(e){} } });

function start(P){ lock.hidden=true; app.innerHTML=P.html; app.hidden=false; $("#bar").hidden=false; init(P.data); }

function init(D){
  var S=(function(){ var s; try{ s=JSON.parse(lsGet(STK)||"{}") }catch(e){ s={} } s.cards=s.cards||{}; s.gate=s.gate||{}; s.letters=s.letters||{}; s.notes=s.notes||{}; return s; })();
  function save(){ lsSet(STK,JSON.stringify(S)); paint(); }
  function flash(el){ el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
  function btn(label,cls,fn){ var b=document.createElement("button"); b.type="button"; b.className=cls; b.textContent=label; b.addEventListener("click",fn); return b; }
  function decided(id){ var c=S.cards[id]||{}; return !!c.d && (c.d!=="note" || !!(c.n||"").trim()); }

  var fs=parseFloat(lsGet(FSK)||"19");
  function setFs(v){ fs=Math.max(15,Math.min(26,v)); document.documentElement.style.setProperty("--fs",fs+"px"); lsSet(FSK,String(fs)); }
  setFs(fs);
  $$("[data-fs]").forEach(function(b){ b.addEventListener("click",function(){ setFs(fs+Number(b.getAttribute("data-fs"))); }); });

  (function(){ var el=$("#countdown"); if(!el) return; var n=new Date(), a=new Date(n.getFullYear(),n.getMonth(),n.getDate()), t=new Date(2026,8,30);
    var d=Math.round((t-a)/864e5);
    el.textContent = d>1 ? d+" days to 30 September" : d===1 ? "30 September is tomorrow" : d===0 ? "30 September is today" : "30 September has passed"; })();

  $$(".tocb").forEach(function(b){ b.addEventListener("click",function(){ var t=document.getElementById(b.getAttribute("data-go")); if(t) t.scrollIntoView({behavior:"smooth",block:"start"}); }); });

  $$(".card").forEach(function(c){
    var id=c.getAttribute("data-id"), st=S.cards[id]||{};
    $$(".db",c).forEach(function(b){
      b.classList.toggle("on",st.d===b.getAttribute("data-d"));
      b.addEventListener("click",function(){
        var cur=S.cards[id]||{}, v=b.getAttribute("data-d");
        cur.d = cur.d===v ? "" : v; S.cards[id]=cur;
        $$(".db",c).forEach(function(x){ x.classList.toggle("on",cur.d===x.getAttribute("data-d")); });
        save(); if(cur.d==="note") $(".cn",c).focus();
      });
    });
    var t=$(".cn",c); t.value=st.n||"";
    t.addEventListener("input",function(){ var cur=S.cards[id]||{}; cur.n=t.value; S.cards[id]=cur; save(); });
    var w=$(".where",c), m=$('mark[data-card="'+id+'"]');
    if(w&&m){ w.hidden=false; w.addEventListener("click",function(){ m.scrollIntoView({behavior:"smooth",block:"center"}); flash(m); }); }
  });
  $$("mark[data-card]").forEach(function(m){
    m.title="Tap to see the call on this line";
    m.addEventListener("click",function(ev){ ev.stopPropagation(); var c=document.getElementById("card-"+m.getAttribute("data-card")); if(c){ c.scrollIntoView({behavior:"smooth",block:"start"}); flash(c); } });
  });

  $$(".text").forEach(function(tx){
    var k=tx.getAttribute("data-k"); S.notes[k]=S.notes[k]||{}; var N=S.notes[k];
    function render(p,edit){
      var i=p.getAttribute("data-i"), box=p.nextElementSibling, n=N[i];
      if(!box||!box.classList.contains("pnote")){ box=null; }
      if(!n || (!edit && !(n.t||"").trim())){ if(n && !(n.t||"").trim()){ delete N[i]; save(); } if(box) box.remove(); p.classList.remove("has"); return; }
      if(!box){ box=document.createElement("div"); box.className="pnote"; p.parentNode.insertBefore(box,p.nextSibling); }
      p.classList.toggle("has",!!(n.t||"").trim());
      box.innerHTML="";
      if(n.q){ var q=document.createElement("div"); q.className="q"; q.textContent="“"+n.q+"”"; box.appendChild(q); }
      if(edit){
        var ta=document.createElement("textarea"); ta.rows=3; ta.placeholder="Your note on this paragraph"; ta.value=n.t||""; box.appendChild(ta);
        ta.addEventListener("input",function(){ n.t=ta.value; save(); p.classList.toggle("has",!!ta.value.trim()); });
        var row=document.createElement("div"); row.className="row";
        row.appendChild(btn("Done","mini pri",function(){ render(p,false); }));
        row.appendChild(btn("Delete note","mini",function(){ delete N[i]; save(); render(p,false); }));
        box.appendChild(row); setTimeout(function(){ try{ta.focus({preventScroll:true})}catch(e){ta.focus()} },30);
      } else {
        var s=document.createElement("div"); s.className="saved"; s.textContent=n.t; s.title="Tap to edit";
        s.addEventListener("click",function(){ render(p,true); }); box.appendChild(s);
      }
    }
    $$(".para",tx).forEach(function(p){
      var i=p.getAttribute("data-i");
      if(N[i] && (N[i].t||"").trim()) render(p,false);
      p.addEventListener("click",function(ev){
        if(ev.target.closest("mark")) return;
        var box=p.nextElementSibling, open=box&&box.classList.contains("pnote")&&box.querySelector("textarea");
        if(open){ render(p,false); return; }
        var sel=window.getSelection?window.getSelection():null, q=sel?String(sel).trim():"";
        var n=N[i]||{t:"",s:(D.paras[k]||[])[i]||""};
        if(q && sel.anchorNode && p.contains(sel.anchorNode)) n.q=q.slice(0,400);
        N[i]=n; render(p,true);
      });
    });
  });

  function fmt(t){ return t.trim().split(/\n\s*\n/).map(function(p){ return "<p>"+p.split("\n").map(esc).join("<br>")+"</p>"; }).join(""); }
  $$(".letter").forEach(function(L){
    var k=L.getAttribute("data-k"), orig=D.letters[k], lt=$(".lt",L), ta=$("textarea",L), st=$(".lst",L), eb=$('[data-la="edit"]',L), rb=$('[data-la="reset"]',L);
    function show(){ var cur=S.letters[k]; lt.innerHTML=fmt(cur||orig); st.textContent=cur?"Rewritten by you":"As drafted"; st.classList.toggle("ed",!!cur); rb.hidden=!cur; }
    eb.addEventListener("click",function(){
      if(ta.hidden){ ta.value=S.letters[k]||orig; ta.hidden=false; lt.hidden=true; eb.textContent="Done editing"; ta.focus(); }
      else { ta.hidden=true; lt.hidden=false; eb.textContent="Edit the letter"; show(); }
    });
    ta.addEventListener("input",function(){ if(ta.value.trim()===orig.trim()) delete S.letters[k]; else S.letters[k]=ta.value; save(); });
    rb.addEventListener("click",function(){ delete S.letters[k]; save(); ta.value=orig; show(); });
    show();
  });

  $$(".gate").forEach(function(G){
    var k=G.getAttribute("data-k"), g=S.gate[k]=S.gate[k]||{};
    $$("input[type=checkbox]",G).forEach(function(cb){ var f=cb.getAttribute("data-g"); cb.checked=!!g[f]; cb.addEventListener("change",function(){ g[f]=cb.checked; save(); }); });
    $$(".db",G).forEach(function(b){
      var v=b.getAttribute("data-v"); b.classList.toggle("on",g.v===v);
      b.addEventListener("click",function(){ g.v = g.v===v ? "" : v; $$(".db",G).forEach(function(x){ x.classList.toggle("on",g.v===x.getAttribute("data-v")); }); save(); });
    });
    var t=$("textarea",G); t.value=g.n||""; t.addEventListener("input",function(){ g.n=t.value; save(); });
  });

  function n0(n){ return Number(n).toLocaleString("en-US"); }
  function paintWords(){
    $$(".wcline").forEach(function(el){
      var k=el.getAttribute("data-k"), P=D.pieceMap[k]; if(!P) return;
      var proj=P.words;
      Object.keys(D.cards).forEach(function(id){ var c=D.cards[id]; if(c.piece===k && c.delta && (S.cards[id]||{}).d==="yes") proj+=c.delta; });
      var bad=(P.min&&proj<P.min)||(P.max&&proj>P.max);
      el.innerHTML=esc(n0(P.words)+" words in the extract as it stands")+(proj!==P.words?esc(" · "+n0(proj)+" with the calls you have taken"):"")+esc(" · "+P.range)+(bad?' · <span class="warn">outside the range</span>':"");
    });
  }
  function paint(){
    var ids=Object.keys(D.cards), dec=0;
    ids.forEach(function(id){ var ok=decided(id); if(ok) dec++; var el=document.getElementById("card-"+id); if(el) el.classList.toggle("done",ok); });
    var signed=0;
    D.pieces.forEach(function(p){
      var g=S.gate[p.key]||{}, ok=!!(g.read&&g.own&&g.v); if(ok) signed++;
      var G=$('.gate[data-k="'+p.key+'"]'); if(G) G.classList.toggle("ok",ok);
    });
    $$(".tocb[data-k]").forEach(function(a){
      var k=a.getAttribute("data-k"), mine=ids.filter(function(id){ return (D.cards[id].piece||"other")===k; }), d=mine.filter(decided).length;
      var g=S.gate[k]||{}, ok = k==="other" ? d===mine.length : !!(g.read&&g.own&&g.v);
      a.classList.toggle("ok",ok); var sm=$("small",a); if(sm) sm.textContent=d+"/"+mine.length;
    });
    var nn=0; Object.keys(S.notes).forEach(function(k){ Object.keys(S.notes[k]).forEach(function(i){ if((S.notes[k][i].t||"").trim()) nn++; }); });
    var lr=Object.keys(S.letters).length;
    var line=dec+" of "+ids.length+" calls marked · "+signed+" of "+D.pieces.length+" signed · "+nn+" note"+(nn===1?"":"s")+(lr?" · "+lr+" letter"+(lr===1?"":"s")+" rewritten":"");
    $("#bar .pg").textContent=line; var sl=$("#sumline"); if(sl) sl.textContent=line;
    paintWords();
    return line;
  }

  function exportObj(){
    var boards=Object.keys(D.boards).map(function(b){
      var B=D.boards[b], dec=B.ids.map(function(id){ var c=S.cards[id]||{}; return {id:id,decision:c.d||"",note:(c.n||"").trim()}; });
      return {meta:{doc:B.doc,date:B.date,total:B.ids.length,decided:dec.filter(function(x){return x.decision}).length,via:"jmkay.com send-prep page"},decisions:dec};
    });
    var gate=D.pieces.map(function(p){ var g=S.gate[p.key]||{}, lt=S.letters[p.key]; var o={piece:p.key,title:p.title,venue:p.venue,read:!!g.read,own:!!g.own,verdict:g.v||"",note:(g.n||"").trim(),letter:lt?"rewritten":"as drafted"}; if(lt) o.letter_text=lt; return o; });
    var notes=[];
    D.pieces.forEach(function(p){ var N=S.notes[p.key]||{}; Object.keys(N).sort(function(a,b){return a-b}).forEach(function(i){ var n=N[i]; if((n.t||"").trim()){ var o={piece:p.key,para:Number(i),starts:n.s||"",note:n.t.trim()}; if(n.q) o.quote=n.q; notes.push(o); } }); });
    return {meta:{doc:"jk-sendprep-web-v1",page:location.pathname,built_at:D.state.tag,extracts_at:D.state.aligned,exported:new Date().toISOString()},boards:boards,gate0:gate,notes:notes};
  }
  function claudeText(){ return "Send-prep notes from the jmkay.com page · "+paint()+"\n\n```json\n"+JSON.stringify(exportObj(),null,1)+"\n```\n"; }
  function fallbackCopy(t){ var a=document.createElement("textarea"); a.value=t; a.setAttribute("readonly",""); a.style.position="fixed"; a.style.top="0"; a.style.opacity="0"; document.body.appendChild(a); a.select(); try{a.setSelectionRange(0,t.length)}catch(e){} var ok=false; try{ok=document.execCommand("copy")}catch(e){} a.remove(); return ok; }
  function copyText(t){ if(navigator.clipboard&&navigator.clipboard.writeText){ return navigator.clipboard.writeText(t).then(function(){return true},function(){return fallbackCopy(t)}); } return Promise.resolve(fallbackCopy(t)); }
  function msg(s){ var m=$("#sendmsg"); if(m) m.textContent=s; }
  $$('[data-act="copy"]').forEach(function(b){ b.addEventListener("click",function(){
    var t=claudeText();
    copyText(t).then(function(ok){
      var old=b.textContent; b.textContent=ok?"Copied":"Copy failed"; setTimeout(function(){ b.textContent=old; },1600);
      if(ok) msg("Copied. Paste it into our chat."); else { msg("The clipboard said no. The notes are below; select them and copy by hand."); var d=$("#send details"); if(d){ d.open=true; $("#preview").textContent=t; } }
    });
  }); });
  var ib=$('[data-act="inbox"]'); if(ib) ib.addEventListener("click",function(){
    var body=new URLSearchParams({"form-name":"sendprep-notes","bot-field":"","summary":paint(),"payload":JSON.stringify(exportObj(),null,1)}).toString();
    msg("Sending…");
    fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body}).then(function(r){
      msg(r.ok ? "Sent. It is in the site's Netlify form inbox under sendprep-notes." : "That didn't go through ("+r.status+"). Copy for Claude still works.");
    },function(){ msg("That didn't go through. Copy for Claude still works."); });
  });
  var dl=$('[data-act="dl"]'); if(dl) dl.addEventListener("click",function(){
    var blob=new Blob([JSON.stringify(exportObj(),null,1)],{type:"application/json"}), a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="sendprep-notes-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },800);
  });
  var pd=$("#send details"); if(pd) pd.addEventListener("toggle",function(){ if(pd.open) $("#preview").textContent=claudeText(); });
  var wb=$('[data-act="wipe"]'); if(wb) wb.addEventListener("click",function(){
    if(wb.getAttribute("data-armed")!=="1"){ wb.setAttribute("data-armed","1"); wb.textContent="Tap again to clear"; setTimeout(function(){ wb.removeAttribute("data-armed"); wb.textContent="Clear every mark on this device"; },4000); return; }
    lsDel(STK); location.reload();
  });
  var lb=$('[data-act="lock"]'); if(lb) lb.addEventListener("click",function(){ lsDel(KEYK); location.reload(); });
  paint();
}
})();
</script>
</body>
</html>
