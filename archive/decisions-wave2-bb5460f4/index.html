/* ============================================================
   ENGINE - do not edit below.
   ============================================================ */
const KEY=CONFIG.storageKey;
let state=JSON.parse(localStorage.getItem(KEY)||'{}');
let filter='all';
const $=s=>document.querySelector(s);
const list=$('#list');
const decByKey=Object.fromEntries(CONFIG.decisions.map(d=>[d.key,d]));

function head(){
  $('#h-kicker').textContent=CONFIG.kicker;
  $('#h-title').textContent=CONFIG.title;
  if(CONFIG.showDot){const d=document.querySelector('.dot');d.style.display='inline-block';$('#h-title').appendChild(d);}
  $('#h-sub').textContent=CONFIG.subtitle;
  if(CONFIG.noteBlock){$('#h-note').innerHTML=CONFIG.noteBlock;}else{$('#h-note').style.display='none';}
  $('#h-meta').innerHTML=CONFIG.metrics.map(m=>`<div><b>${m.value}</b><span>${m.label}</span></div>`).join('');
  const fl=$('#filters');
  const fdefs=[{f:'all',t:'All'},{f:'undecided',t:'Undecided'},{f:'flagged',t:'Flagged'}];
  fl.innerHTML=fdefs.map(d=>`<div class="filt${d.f==='all'?' on':''}" data-f="${d.f}">${d.t}</div>`).join('');
  fl.addEventListener('click',e=>{const f=e.target.closest('.filt');if(!f)return;filter=f.dataset.f;fl.querySelectorAll('.filt').forEach(x=>x.classList.toggle('on',x===f));render();});
}

function recLabel(k){const d=decByKey[k];return d?('Recommended: '+d.label):'';}

function render(){
  list.innerHTML='';let lastG=null;
  const vis=ITEMS.filter(it=>{
    if(filter==='undecided')return !state[it.id]||!state[it.id].decision;
    if(filter==='flagged')return it.flag;
    return true;
  });
  if(!vis.length){list.innerHTML='<p style="color:var(--ink-muted);font-size:14px;padding:20px 0">Nothing in this filter.</p>';}
  vis.forEach(it=>{
    if(it.group!==lastG){const h=document.createElement('div');h.className='group-h';h.textContent=it.group;list.appendChild(h);lastG=it.group;}
    const d=(state[it.id]&&state[it.id].decision)||'';
    const card=document.createElement('div');
    card.className='card'+(d?' decided':'')+(it.flag?' flagged':'');
    const tags=(it.tags||[]).map(t=>`<span class="chip ${t.cls||'neutral'}">${t.label}</span>`).join('');
    const flagChip=it.flag?'<span class="chip flag">judgment</span>':'';
    const recHtml=CONFIG.showRecommended&&it.rec?`<span class="rec">${recLabel(it.rec)}</span>`:'';
    const fields=CONFIG.fields.map(f=>{
      const v=(it.fields&&it.fields[f.key])||'';
      if(v==='')return'';
      const lab=f.arrow?`<span class="arrow">&#8594;</span> ${f.label}`:f.label;
      return `<span class="lbl">${lab}</span><div class="txt ${f.box?'field-box':'field-plain'}">${v}</div>`;
    }).join('');
    const btns=CONFIG.decisions.map(dec=>`<div class="choice${d===dec.key?' sel':''}" data-color="${dec.color}" data-v="${dec.key}" data-id="${it.id}">${dec.label}<span class="k">${dec.sub||''}</span></div>`).join('');
    const showNote=CONFIG.reviseKey && d===CONFIG.reviseKey;
    card.innerHTML=`<div class="chiprow">${tags}${flagChip}${recHtml}</div>${fields}
      <div class="choices">${btns}</div>
      <div class="revnote${showNote?' show':''}"><textarea data-note="${it.id}" placeholder="What would you change?">${(state[it.id]&&state[it.id].note)||''}</textarea></div>`;
    list.appendChild(card);
  });
  bind();progress();
}

function bind(){
  list.querySelectorAll('.choice').forEach(c=>c.addEventListener('click',()=>{
    const id=c.dataset.id,v=c.dataset.v;state[id]=state[id]||{};
    state[id].decision=(state[id].decision===v)?'':v;save();render();
  }));
  list.querySelectorAll('textarea[data-note]').forEach(t=>t.addEventListener('input',()=>{
    const id=t.dataset.note;state[id]=state[id]||{};state[id].note=t.value;save();jsonOut();
  }));
}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function progress(){
  const total=ITEMS.length,done=ITEMS.filter(it=>state[it.id]&&state[it.id].decision).length;
  $('#progfill').style.width=(total?done/total*100:0)+'%';
  $('#progtxt').textContent=`${done} / ${total} decided`;
  $('#ab-status').textContent=`${done} decided`;
  jsonOut();
}
function build(){
  const out={meta:Object.assign({},CONFIG.docMeta,{total:ITEMS.length}),decisions:[]};
  ITEMS.forEach(it=>{const s=state[it.id]||{};out.decisions.push({id:it.id,group:it.group,recommended:it.rec||null,decision:s.decision||null,note:s.note||""});});
  out.meta.decided=out.decisions.filter(d=>d.decision).length;
  CONFIG.decisions.forEach(dec=>{out.meta[dec.key]=out.decisions.filter(d=>d.decision===dec.key).map(d=>d.id);});
  return out;
}
function jsonOut(){$('#jsonprev').textContent=JSON.stringify(build(),null,2);}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900);}

$('#copyBtn').addEventListener('click',async()=>{
  const txt=JSON.stringify(build(),null,2);
  try{await navigator.clipboard.writeText(txt);toast('Decisions copied - paste them back');}
  catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Decisions copied');}
});
$('#dlBtn').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(build(),null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=CONFIG.jsonName;a.click();URL.revokeObjectURL(a.href);toast('JSON downloaded');
});
$('#resetBtn').addEventListener('click',()=>{if(confirm('Clear all decisions?')){state={};save();render();toast('Reset');}});

document.title=CONFIG.title;
head();render();
</script>
