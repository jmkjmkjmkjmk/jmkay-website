<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>Page not found — J. M. Kay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  @font-face {
      font-family: 'Kay Display';
      src: url('/KayDisplay-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
  }
  :root{
    --terracotta:#C2603F;
    --warm-white:#FDFBF7;
    --ink:#1C1917;
    --ink-muted:#78716C;
    --line:#E2DBD0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;}
  body{
    background:var(--warm-white);
    color:var(--ink);
    font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-weight:300;
    line-height:1.6;
    display:flex;
    align-items:center;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
    padding:32px;
  }
  .wrap{max-width:520px;text-align:center;}
  .wordmark{
    font-family:'Kay Display','Instrument Serif',Georgia,serif;
    font-size:26px;
    letter-spacing:.02em;
    color:var(--ink);
    text-decoration:none;
    display:inline-block;
    margin-bottom:44px;
  }
  .subtitle{
    display:block;
    font-family:'Space Mono',monospace;
    font-weight:400;
    font-size:11px;
    letter-spacing:.28em;
    color:var(--ink);
    margin-top:8px;
  }
  .subtitle .diamond{
    display:inline-block;
    width:5.2px;height:5.2px;
    background:var(--terracotta);
    transform:rotate(45deg);
    border-radius:1.1px;
    margin:0 1px;
    vertical-align:middle;
  }
  h1{
    font-family:'Instrument Serif',Georgia,serif;
    font-weight:400;
    font-size:42px;
    line-height:1.15;
    margin:0 0 16px;
  }
  p{
    font-size:16px;
    color:var(--ink-muted);
    margin:0 auto 34px;
    max-width:400px;
  }
  .links{
    display:flex;
    gap:26px;
    justify-content:center;
    flex-wrap:wrap;
    border-top:1px solid var(--line);
    padding-top:26px;
  }
  .links a{
    font-family:'Space Mono',monospace;
    font-size:11.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid var(--terracotta);
    padding-bottom:3px;
    transition:color .2s;
  }
  .links a:hover{color:var(--terracotta);}
  @media (max-width:520px){
    h1{font-size:32px;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="wordmark" href="/">
      J.M.KAY
      <span class="subtitle">ST<span class="diamond"></span>RY PRODUCER</span>
    </a>
    <h1>This page isn&rsquo;t here.</h1>
    <p>The link may be out of date, or the page may have moved. The work is all still one click away.</p>
    <div class="links">
      <a href="/">Home</a>
      <a href="/writing.html">Perspectives</a>
      <a href="/#work">Work</a>
      <a href="/#contact">Contact</a>
    </div>
  </div>
</body>
</html>
